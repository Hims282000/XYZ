version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  api-gateway:
    build: ./backend/api-gateway
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    ports:
      - '3000:3000'
    depends_on:
      - redis
  ingestion:
    build: ./backend/ingestion
    environment:
      - REDIS_URL=redis://redis:6379
      - INGESTION_PORT=3001
    ports:
      - '3001:3001'
    depends_on:
      - redis
  analytics:
    build: ./backend/analytics
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=esm
      - ANALYTICS_PORT=3002
    ports:
      - '3002:3002'
    depends_on:
      - mongo
volumes:
  mongo-data:
